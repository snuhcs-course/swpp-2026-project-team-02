# Access log fields for this site. Authorization is never logged; neither are other request headers.
log_format licenseplanner_api '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" $request_time';

server {
    listen 80;
    server_name swpp26t02.147-46-242-174.sslip.io;

    client_max_body_size 1m;
    access_log /var/log/nginx/access.log licenseplanner_api;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend keys its per-IP request limits on this value only; it replaces any client copy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
