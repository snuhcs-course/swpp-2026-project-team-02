name: Prod APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Optional live API base URL override; otherwise LIVE_API_BASE_URL is used.
        required: false
        type: string
  push:
    branches:
      - main
      - iteration-3
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: prod-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-live-release:
    name: Build signed live release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.LIVE_API_BASE_URL }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Validate release inputs
        shell: bash
        run: |
          test -n "$API_BASE_URL" || { echo "LIVE_API_BASE_URL is required"; exit 1; }
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is required"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is required"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is required"; exit 1; }

      - name: Restore signing keystore
        shell: bash
        run: |
          key_store_path="$RUNNER_TEMP/licenseplanner-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$key_store_path"
          test -s "$key_store_path"
          chmod 600 "$key_store_path"

      - name: Assemble signed live release APK
        shell: bash
        run: >-
          ./gradlew --no-daemon assembleLiveRelease
          -PlicensePlanner.apiBaseUrl="$API_BASE_URL"
          -PlicensePlanner.releaseStoreFile="$RUNNER_TEMP/licenseplanner-release.jks"
          -PlicensePlanner.releaseStorePassword="$KEYSTORE_PASSWORD"
          -PlicensePlanner.releaseKeyAlias="$KEY_ALIAS"
          -PlicensePlanner.releaseKeyPassword="$KEY_PASSWORD"

      - name: Verify APK signature
        shell: bash
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs
          app/build/outputs/apk/live/release/app-live-release.apk

      - name: Upload signed live release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-release-apk-${{ github.sha }}
          path: frontend/app/build/outputs/apk/live/release/app-live-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/licenseplanner-release.jks"
