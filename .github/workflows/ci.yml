name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily 00:00 UTC (09:00 Asia/Seoul) on the default branch.
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  # Including the event keeps push and scheduled runs on main from cancelling each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install CI coverage tool
        run: python -m pip install -r requirements-ci.txt

      - name: Check interpreter and imports
        run: python -c "import sys; import api_service; print(sys.executable)"

      - name: Reset coverage data
        id: coverage-erase
        run: python -m coverage erase

      - name: License planner unit tests
        run: python -m coverage run -m unittest discover -s tests/license_planner_tests -v

      - name: Schedule adjuster unit tests
        if: ${{ !cancelled() && steps.coverage-erase.outcome == 'success' }}
        run: python -m coverage run --append -m unittest discover -s tests/schedule_adjuster_tests -v

      - name: API unit tests
        if: ${{ !cancelled() && steps.coverage-erase.outcome == 'success' }}
        run: python -m coverage run --append -m unittest discover -s tests/api_tests -v

      - name: Coverage reports
        if: ${{ always() && steps.coverage-erase.outcome == 'success' }}
        run: |
          python -m coverage report -m
          python -m coverage xml
          python -m coverage html

      - name: Evidence validator unit tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s ../scripts/tests -v

      - name: AI evaluation runner offline tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s ../docs/iter3-ai-eval -p 'test_*.py' -v

      - name: Validate coverage reports
        run: python ../scripts/verify_test_evidence.py --repo-root .. --scope backend

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: |
            backend/coverage-results/coverage.xml
            backend/coverage-results/html/
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      # Sole Gradle cache; by default it writes only from the default branch, so PR runs never write.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests (demo and live)
        run: bash ./gradlew --no-daemon testDemoDebugUnitTest testLiveDebugUnitTest

      - name: Contract check against this checkout's backend
        working-directory: .
        run: >-
          python frontend/contract_checks/verify_request.py
          --backend-ref HEAD
          --request frontend/app/build/contract-check/study-plan-request.json

      - name: Unit test coverage reports (demo and live)
        run: bash ./gradlew --no-daemon createDemoDebugUnitTestCoverageReport createLiveDebugUnitTestCoverageReport

      - name: Validate coverage reports
        run: python ../scripts/verify_test_evidence.py --repo-root .. --scope android

      - name: Build debug APKs and lint
        run: bash ./gradlew --no-daemon assembleDemoDebug assembleLiveDebug lintDemoDebug lintLiveDebug

      - name: Upload test, lint and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            frontend/app/build/test-results/test*DebugUnitTest/
            frontend/app/build/reports/tests/test*DebugUnitTest/
            frontend/app/build/reports/lint-results-*Debug.*
            frontend/app/build/reports/coverage/test/demo/debug/
            frontend/app/build/reports/coverage/test/live/debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apks
          path: |
            frontend/app/build/outputs/apk/demo/debug/app-demo-debug.apk
            frontend/app/build/outputs/apk/live/debug/app-live-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-live-e2e:
    name: Android UI and live E2E
    # Boot the emulator only after the quicker backend and Android checks succeed.
    needs: [backend, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Start fixed live-backend fixture
        shell: bash
        run: |
          log_file="$GITHUB_WORKSPACE/backend/fixed-live-e2e.log"
          python backend/test_support/fixed_live_e2e_server.py --host 0.0.0.0 --port 8000 > "$log_file" 2>&1 &
          echo "$!" > "$GITHUB_WORKSPACE/backend/fixed-live-e2e.pid"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          cat "$log_file"
          exit 1

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run demo UI and live E2E on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API 35 is recognized as a compatible device by this project's
          # Android Gradle Plugin and live debug variant.
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            # GitHub's hardware-accelerated emulator does not expose the runner
            # through 10.0.2.2. Map its loopback port to the fixture explicitly.
            adb -s emulator-5554 reverse tcp:8000 tcp:8000
            adb -s emulator-5554 reverse --list
            bash -lc 'cd frontend || exit 1; result=0; export ANDROID_SERIAL=emulator-5554; bash ./gradlew --no-daemon :app:connectedDemoDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.class=com.swpp.licenseplanner.ui.MainFlowUiTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || result=1; mkdir -p app/build/compose-ui-diagnostics; adb -s emulator-5554 exec-out run-as com.swpp.licenseplanner.demo tar -C files/compose-ui-diagnostics -cf - . | tar -xf - -C app/build/compose-ui-diagnostics || true; bash ./gradlew --no-daemon :app:connectedLiveDebugAndroidTest --console=plain -PlicensePlanner.apiBaseUrl=http://127.0.0.1:8000/api/v1 || result=1; exit "$result"'

      - name: Print fixed live-backend fixture log
        if: always()
        shell: bash
        run: cat "$GITHUB_WORKSPACE/backend/fixed-live-e2e.log"

      - name: Upload Android UI and live E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-live-e2e-evidence
          path: |
            frontend/app/build/outputs/androidTest-results/connected/debug/flavors/demo/
            frontend/app/build/reports/androidTests/connected/debug/flavors/demo/
            frontend/app/build/compose-ui-diagnostics/
            frontend/app/build/outputs/androidTest-results/connected/debug/flavors/live/
            frontend/app/build/reports/androidTests/connected/debug/flavors/live/
            backend/fixed-live-e2e.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop fixed live-backend fixture
        if: always()
        shell: bash
        run: |
          pid_file="$GITHUB_WORKSPACE/backend/fixed-live-e2e.pid"
          test -f "$pid_file" && kill "$(cat "$pid_file")" || true
